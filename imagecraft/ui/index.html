<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ImageCraft</title>
    <link rel="stylesheet" href="./css/theme.css" />
  </head>
  <body>
    <div id="app">

      <!-- Custom title bar (frameless window) -->
      <header class="titlebar" id="titlebar">
        <div class="drag-region" id="drag-region">
          <img class="app-logo" src="./assets/ImageCraft.ico" alt="ImageCraft" draggable="false" />
          <span class="app-title">ImageCraft</span>
        </div>
        <div class="win-buttons">
          <button id="btn-theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
          <button id="btn-min" title="Minimize" aria-label="Minimize">─</button>
          <button id="btn-max" title="Maximize / Restore" aria-label="Maximize">▢</button>
          <button id="btn-close" class="close" title="Close" aria-label="Close">✕</button>
        </div>
      </header>

      <!-- Toolbar -->
      <nav class="toolbar" id="toolbar">
        <button id="tb-open" title="Open image (Ctrl+O)"><span class="ic">🗀</span>Open</button>
        <button id="tb-folder" title="Open folder (Ctrl+Shift+O)"><span class="ic">🗁</span>Folder</button>
        <span class="sep"></span>
        <button id="tb-undo" title="Undo (Ctrl+Z)" disabled><span class="ic">↩</span>Undo</button>
        <button id="tb-redo" title="Redo (Ctrl+Y)" disabled><span class="ic">↪</span>Redo</button>
        <span class="sep"></span>
        <button id="tb-reset" title="Reset current image"><span class="ic">⟲</span>Reset</button>
        <button id="tb-reset-all" title="Reset all images">Reset All</button>
        <span class="sep"></span>
        <button id="tb-zoom-out" title="Zoom out (Ctrl+-)"><span class="ic">−</span></button>
        <span class="zoom-readout" id="zoom-readout" title="Zoom level">100%</span>
        <button id="tb-zoom-in" title="Zoom in (Ctrl++)"><span class="ic">+</span></button>
        <button id="tb-fit" title="Fit to window">Fit</button>
        <button id="tb-1to1" title="Actual size (1:1)">1:1</button>
        <button id="tb-compare" title="Before / after comparison" disabled>Compare</button>
        <span class="sep"></span>
        <button id="tb-sidebar" title="Toggle sidebar">☰ Panels</button>
        <span class="sep"></span>
        <select id="tb-perf" title="Preview performance / resolution">
          <option value="medium" selected>Perf: High</option>
          <option value="low">Perf: Low</option>
        </select>
        <span class="spacer"></span>
        <button id="tb-save" title="Save current (Ctrl+S)" disabled><span class="ic">⬇</span>Save</button>
        <button id="tb-save-all" title="Save modified images (Ctrl+Shift+S)" disabled>Save Modified</button>
        <button id="tb-save-session" title="Save every image in the session" disabled>Save All</button>
        <button id="tb-tutorial" title="Show the guided tutorial">? Tutorial</button>
        <button id="tb-about" title="About ImageCraft">ℹ About</button>
      </nav>

      <!-- Main content: viewer + sidebar -->
      <main class="content" id="content">
        <div class="viewer-wrap" id="viewer-wrap">
          <div class="viewer" id="viewer">
            <canvas id="viewer-canvas"></canvas>
          </div>
          <div class="empty-state" id="empty-state">
            <div class="big">🖼</div>
            <h2>No image loaded</h2>
            <p>Open a single image or a folder to start transforming and augmenting.
               Adjust parameters on the panels and see a live preview; edits are
               non-destructive and undoable.</p>
            <div class="btn-row" style="justify-content:center;">
              <button class="primary" id="es-open">Open Image…</button>
              <button id="es-folder">Open Folder…</button>
            </div>
          </div>
          <!-- Crop overlay (DOM-based, positioned over the canvas) -->
          <div id="crop-overlay" class="crop-overlay" hidden>
            <div id="crop-rect" class="crop-rect">
              <div class="crop-handle" data-handle="nw"></div>
              <div class="crop-handle" data-handle="ne"></div>
              <div class="crop-handle" data-handle="sw"></div>
              <div class="crop-handle" data-handle="se"></div>
              <div class="crop-handle" data-handle="n"></div>
              <div class="crop-handle" data-handle="s"></div>
              <div class="crop-handle" data-handle="w"></div>
              <div class="crop-handle" data-handle="e"></div>
              <!-- Rule of thirds lines -->
              <div class="crop-third crop-third-v1"></div>
              <div class="crop-third crop-third-v2"></div>
              <div class="crop-third crop-third-h1"></div>
              <div class="crop-third crop-third-h2"></div>
            </div>
          </div>
          <div id="compare" class="compare" hidden></div>
          <div class="nav-arrows" id="nav-arrows" hidden>
            <button class="nav-prev" id="nav-prev" title="Previous image (A)">‹</button>
            <button class="nav-next" id="nav-next" title="Next image (D)">›</button>
          </div>
          <div class="viewer-tools" id="viewer-tools" hidden>
            <button id="vz-out" title="Zoom out (Ctrl+-)">−</button>
            <span class="zoom-readout" id="viewer-zoom-readout">100%</span>
            <button id="vz-in" title="Zoom in (Ctrl++)">+</button>
            <button id="vz-fit" title="Fit to window">Fit</button>
            <button id="vz-1to1" title="Actual size (1:1)">1:1</button>
            <button id="vz-compare" title="Before / after">Compare</button>
          </div>
        </div>

        <aside class="sidebar" id="sidebar" data-dock="right">
          <div class="sidebar-head">
            <span class="label">Controls</span>
            <label class="check-row" style="margin:0 6px 0 auto;font-size:var(--fs-xs);">
              <input type="checkbox" id="sb-live-preview" checked>
              <span>Live</span>
            </label>
            <button id="sb-dock" title="Dock position (right / left / bottom)">⇆</button>
            <button id="sb-collapse" title="Collapse / expand">❮</button>
          </div>
          <div class="sidebar-tabs" id="sidebar-tabs"></div>
          <div class="sidebar-body" id="sidebar-body"></div>
        </aside>
      </main>

      <!-- Status bar -->
      <footer class="statusbar" id="statusbar">
        <span id="st-state">Ready</span>
        <span id="st-dimensions"></span>
        <span class="spacer"></span>
        <span id="st-position" class="info"></span>
      </footer>
    </div>

    <div class="progress-host" id="progress-host">
      <div class="progress-track" id="progress-track"></div>
    </div>
    <div class="toast-host" id="toast-host"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
